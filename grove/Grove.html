 face-down piles for runes, neutrals, and towers.`,detail:[`Everyone is dealt 3. Seat 0 starts.`,`The Ancient is shuffled into the remaining deck by table size (about mid for 2–4, deeper for larger tables, ±5%).`,`Reward piles: River → runes, Jungle → neutrals, Lane → towers. Three-of-a-kind terrain combos take the top of the matching pile.`]},{id:`turn`,title:`Your turn`,badge:`Basics`,badgeClass:`timing-cast`,summary:`Draw 2 at the start, then take two actions. Discard down to 7 when you end.`,detail:[`Start of turn: draw 2 (hand may go over 7 until you end). You get 2 actions.`,`Spend an action to play a hero, item, or reward — or to draw one more card from the deck.`,`Instant cards and terrain combos are free (they do not spend an action).`,`You may seat several heroes as a squad for one action: pick the active hero, click companions to bring them in silently, then choose a team. Only the active ability fires.`,`End turn: if your hand is over 7, discard down to 7 first.`]},{id:`win`,title:`How the match ends`,badge:`End`,badgeClass:`timing-instant`,summary:`Ancient Draw, empty deck, or target score. Highest total wins.`,detail:[`Ancient Draw: drawing The Ancient starts the final round — each player gets one more turn, then highest score wins (+${k.ancientBonus} to whoever controls the Ancient; set in Match options).`,`Emptying the shared deck starts the same final round.`,`Target score (default on): end your turn on it and still hold it alone at the start of your next turn to win early.`,`Ties are possible; the engine does not force a tiebreak.`]},{id:`zones`,title:`Zones`,badge:`Zones`,badgeClass:`timing-instant`,summary:`Discard, destroy, and exile mean different things.`,detail:[`Discard: hand → grave. Destroy: board → grave. Exile: out of the game (used runes, neutrals, and towers are exiled).`,`Exiled cards do not interact. Bounce returns a board hero to its owner’s hand.`]}],fu=[{id:`on-play`,title:`On play`,badge:`On play`,badgeClass:`timing-cast`,summary
